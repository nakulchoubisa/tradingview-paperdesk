server { listen 80; server_name _;
 location /.well-known/acme-challenge/ { root /var/www/certbot; }
 location /api/ { proxy_pass http://api:8000/api/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_http_version 1.1; proxy_buffering off; proxy_read_timeout 3600s; }
 location /health { proxy_pass http://api:8000/health; }
 location / { proxy_pass http://web:80; }
}
