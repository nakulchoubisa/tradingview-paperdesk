services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperdesk
      POSTGRES_USER: paperdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperdesk -d paperdesk"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://paperdesk:${POSTGRES_PASSWORD}@db:5432/paperdesk
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on: {db: {condition: service_healthy}}
    expose: ["8000"]
  web:
    build: ./frontend
    restart: unless-stopped
    depends_on: [api]
    expose: ["80"]
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro", "./certbot/conf:/etc/letsencrypt:ro", "./certbot/www:/var/www/certbot:ro"]
    depends_on: [web, api]
volumes:
  postgres_data:
