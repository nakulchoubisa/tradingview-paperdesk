databases:
  - name: paperdesk-db
    plan: free
    region: singapore
    databaseName: paperdesk
    user: paperdesk
    postgresMajorVersion: 16

services:
  - type: web
    name: paperdesk
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paperdesk-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: ""
